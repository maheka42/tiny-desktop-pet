<!doctype html><html><head><meta charset="UTF-8"><title>Pip Chat</title><link rel="stylesheet" href="chat.css"></head><body>
<header><div class="avatar"><img src="../assets/pet.png"></div><div><strong>Pip</strong><small>Tiny desktop companion</small></div><button id="close">×</button></header>
<main id="messages"></main>
<section class="tasks"><div class="tasks-head"><strong>Tasks</strong><span id="xp"></span></div><div class="task-add"><input id="taskInput" placeholder="Add a small goal…"><button id="addTask">+</button></div><div id="taskList"></div></section>
<form id="composer"><input id="input" autocomplete="off" placeholder="Talk to Pip…"><button>Send</button></form>
<script src="chat.js"></script></body></html>
